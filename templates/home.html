{% extends 'layout.html' %}
<body>
  <div class="container">
    <h1>Welcome to Home</h1>
    <p>This is the root placement template for your FastAPI application.</p>
    {% for post in posts %}
      <h2>{{ post.title }}</h2>
      <p>By {{ post.author }}</p>
      <p>{{ post.content }}</p>
      <hr />
    {% endfor %}
  </div>
</body>
