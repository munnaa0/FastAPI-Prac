{% extends "layout.html" %}
{% block content %}
  {% for post in posts %}
    <article class="content-section py-3 px-4 mb-4">
      <div class="d-flex align-items-start gap-4">
        <img class="rounded-circle article-img flex-shrink-0"
             src="{{ post.author.image_path }}"
             alt="{{ post.author.username }}'s profile picture"
             width="64"
             height="64"
             loading="lazy">
        <div class="flex-grow-1">
          <div class="article-metadata mb-2">
            <a class="me-2" href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.username }}</a>
            <small class="text-body-secondary">{{ post.date_posted | friendly_date }}</small>
          </div>
          <h2>
            <a class="article-title" href="{{ url_for('post_details', post_id = post.id ) }}">{{ post.title }}</a>
          </h2>
          <p class="article-content">{{ post.content | truncate(240) }}</p>
        </div>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
