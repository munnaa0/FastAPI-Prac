[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A small FastAPI blog application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.139",
  "jinja2>=3.1",
  "pwdlib[argon2]>=0.3.1",
  "pydantic[email]>=2.0",
  "pydantic-settings>=2.14",
  "pyjwt>=2.15",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.0",
  "uvicorn>=0.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.djlint]
ignore = "H030,H020"

[tool.ruff.lint]
ignore = ["I001"]
