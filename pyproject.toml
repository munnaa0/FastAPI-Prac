[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A small FastAPI blog application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.139",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "uvicorn>=0.51",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.djlint]
ignore = "H030,H020"

[tool.ruff.lint]
ignore = ["I001"]
